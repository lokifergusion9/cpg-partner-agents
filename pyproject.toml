[project]
name = "partner-agents"
version = "0.0.1"
description = "LangGraph multi-agent system that finds CPG partners, verifies their contacts and drafts human-approved outreach."
readme = "CLAUDE.md"
authors = [{ name = "Lokesh Kumar" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.7",
    "langchain-core>=1.7.3",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "httpx>=0.28.1",
    "ddgs>=9.16.1",
    "tldextract>=5.4.0",
    "trafilatura>=2.3.1",
    "tiktoken>=0.14.0",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.2.0",
    "langgraph>=1.2.19",
    "phonenumbers>=9.0.42",
    "google-auth-oauthlib>=1.5.0",
    "google-auth>=2.62.0",
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
    "gradio>=6.31.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "respx>=0.23.1",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "partner_agents"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# Docs are the contract (CLAUDE.md); their code blocks are kept exactly as written.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # bugbear
    "SIM",   # simplify
    "ASYNC", # async pitfalls
    "RUF",   # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["partner_agents"]
warn_unreachable = true
plugins = ["pydantic.mypy"]

# lxml ships no type information (ADR-015: one override per untyped library, with a reason).
[[tool.mypy.overrides]]
module = ["lxml", "lxml.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Offline by default (CLAUDE.md rule 4). `pytest -m live` overrides this.
addopts = ["-ra", "--strict-markers", "-m", "not live"]
markers = [
    "live: calls real external APIs; needs a .env (deselected by default)",
]
